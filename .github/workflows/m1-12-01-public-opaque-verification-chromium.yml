name: M1.12.01 real public credential opaque verification and neutral invalid capability Chromium
on:
  pull_request:
    paths:
      - 'tests/browser/public-verification-invalid-capability.browser.test.mjs'
      - 'tests/browser/m1-12-public-verification.browser.test.mjs'
      - 'src/app/verify/**'
      - 'src/lib/public-verification/**'
      - 'src/lib/credential/**'
      - 'database/migrations/**'
      - '.github/workflows/m1-12-01-public-opaque-verification-chromium.yml'
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - 'tests/browser/public-verification-invalid-capability.browser.test.mjs'
      - 'tests/browser/m1-12-public-verification.browser.test.mjs'
      - 'src/app/verify/**'
      - 'src/lib/public-verification/**'
      - 'src/lib/credential/**'
      - 'database/migrations/**'
      - '.github/workflows/m1-12-01-public-opaque-verification-chromium.yml'
permissions:
  contents: read
concurrency:
  group: m11201-public-opaque-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-credential-opaque-privacy-real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact PR head or signed QA SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Set up pinned Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install lockfile dependencies and real Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Existing real public credential lookup opaque capability and invalid abuse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/public-verification-invalid-capability.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m11201-public-opaque-chromium.log
          for line in 'ℹ tests 1' 'ℹ pass 1' 'ℹ fail 0' 'ℹ skipped 0'; do
            grep -q "$line" .autopilot/artifacts/m11201-public-opaque-chromium.log
          done
          grep -q 'ACTUAL_M112_PUBLIC_BROWSER genuine credential resolves to short-lived opaque token and permitted projection only' .autopilot/artifacts/m11201-public-opaque-chromium.log
          for category in 'missing valid-shape identifier' 'malformed identifier' 'guessed unsupported identifier' 'tampered signed capability' 'expired signed capability'; do
            grep -q "ACTUAL_M112_INVALID_PUBLIC_BROWSER ${category} denied neutrally with no credential data" .autopilot/artifacts/m11201-public-opaque-chromium.log
          done
          grep -q 'ACTUAL_M112_PUBLIC_RATE_LIMIT_BROWSER repeated credential lookups blocked safely, no private projection on limited result' .autopilot/artifacts/m11201-public-opaque-chromium.log
      - name: Retain original exact SHA real public Chromium proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11201-public-opaque-chromium-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m11201-public-opaque-chromium.log
          if-no-files-found: warn
          retention-days: 90
