name: M1.04 six-role portal selector and header isolation QA

on:
  pull_request:
    paths:
      - "src/lib/authorization/**"
      - "src/lib/auth/**"
      - "src/app/**/dashboard/**"
      - "src/proxy.ts"
      - "tests/browser/authentication-boundaries-e2e.browser.test.mjs"
      - "tests/platform/authorization-final-isolation-suite.test.mjs"
      - ".github/workflows/m1-04-six-role-portal-query-isolation.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "src/lib/authorization/**"
      - "src/lib/auth/**"
      - "src/app/**/dashboard/**"
      - "src/proxy.ts"
      - "tests/browser/authentication-boundaries-e2e.browser.test.mjs"
      - "tests/platform/authorization-final-isolation-suite.test.mjs"
      - ".github/workflows/m1-04-six-role-portal-query-isolation.yml"

permissions:
  contents: read

concurrency:
  group: m10401-six-role-forged-query-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-chromium-six-role-forged-request:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install actual Chromium
        run: npx playwright install --with-deps chromium
      - name: 6 roles x 5 foreign portals, including forged query and HTTP headers and DB audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/authentication-boundaries-e2e.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m10401-six-role-request-browser.log
      - name: Preserve real browser exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10401-six-role-browser-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10401-six-role-request-browser.log
          if-no-files-found: warn
          retention-days: 30

  native-tenant-command-and-role-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Native DB tenant scope, role and permission race isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test tests/platform/authorization-final-isolation-suite.test.mjs 2>&1 | tee .autopilot/artifacts/m10401-tenant-native.log
      - name: Preserve native exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10401-tenant-native-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10401-tenant-native.log
          if-no-files-found: warn
          retention-days: 30
