name: M1.03 session exit, signout and copied-cookie replay Chromium QA

on:
  pull_request:
    paths:
      - "src/app/auth/**"
      - "src/lib/auth/auth-session-service.ts"
      - "src/lib/auth/auth-session-cookie.ts"
      - "src/lib/auth/auth-access-repository.ts"
      - "src/components/portal/**"
      - "tests/browser/active-session-boundaries.browser.test.mjs"
      - "tests/browser/authentication-boundaries-e2e.browser.test.mjs"
      - "tests/browser/six-role-session-cookie-replay.browser.test.mjs"
      - ".github/workflows/m1-03-six-role-session-replay.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "src/app/auth/**"
      - "src/lib/auth/auth-session-service.ts"
      - "src/lib/auth/auth-session-cookie.ts"
      - "src/lib/auth/auth-access-repository.ts"
      - "src/components/portal/**"
      - "tests/browser/active-session-boundaries.browser.test.mjs"
      - "tests/browser/authentication-boundaries-e2e.browser.test.mjs"
      - "tests/browser/six-role-session-cookie-replay.browser.test.mjs"
      - ".github/workflows/m1-03-six-role-session-replay.yml"

permissions:
  contents: read

concurrency:
  group: m10307-session-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-chromium-six-role-copied-cookie-logout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install actual Chromium
        run: npx playwright install chromium
      - name: Check six-role copied cookie, Exit, Cancel, signout, revocation and DB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/six-role-session-cookie-replay.browser.test.mjs tests/browser/active-session-boundaries.browser.test.mjs tests/browser/authentication-boundaries-e2e.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m10307-session-replay-browser.log
      - name: Retain exact-SHA browser log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10307-six-role-replay-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10307-session-replay-browser.log
          if-no-files-found: warn
          retention-days: 30

  native-authoritative-session-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate DB session authority and signed-out proxy contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test tests/platform/authorization-session-context.test.mjs tests/platform/authentication-signed-out-proxy.test.mjs 2>&1 | tee .autopilot/artifacts/m10307-session-native.log
      - name: Retain exact-SHA native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10307-session-native-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10307-session-native.log
          if-no-files-found: warn
          retention-days: 30
