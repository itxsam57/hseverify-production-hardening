name: M2.05 real browser QA

on:
  push:
    branches: [feat/m2-05-randomized-assessment-forms]
    paths:
      - "scripts/m2-05-browser-qa.mjs"
      - "src/app/admin/(portal)/assessment-blueprints/**"
      - "src/lib/assessment-generation/**"
      - "database/migrations/0039_randomized_assessment_forms.*"
      - ".github/workflows/m2-05-browser.yml"
  pull_request:
    branches: [qa/hard-browser-m2-02-m2-06, main]
    paths:
      - "scripts/m2-05-browser-qa.mjs"
      - "src/app/admin/(portal)/assessment-blueprints/**"
      - "src/lib/assessment-generation/**"
      - "database/migrations/0039_randomized_assessment_forms.*"
      - ".github/workflows/m2-05-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HSE_APP_ENV: test
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: /tmp/hseverify-m205-browser-db
      HSE_SESSION_SECRET: m2-05-browser-session-secret-2026-with-at-least-thirty-two-characters
      HSE_AUTH_PEPPER: m2-05-browser-auth-pepper-2026-with-at-least-thirty-two-characters
      HSE_ENABLE_AUTH_SANDBOX: "true"
      HSE_AUTH_SANDBOX_ACCESS_KEY: m2-05-browser-sandbox-key-2026
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"
      HSE_RELEASE_SHA: m2-05-browser
      HSE_BROWSER_BASE_URL: http://127.0.0.1:3002
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Migrate clean M2.05 browser database
        run: |
          rm -rf "$HSE_PGLITE_DATA_DIR"
          npm run db:migrate
      - name: Install pinned Playwright without modifying lockfile
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Start real Next.js application
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3002 > /tmp/hse-m205-browser-server.log 2>&1 &
          echo $! > /tmp/hse-m205-browser-server.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3002/; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/hse-m205-browser-server.pid)" 2>/dev/null; then
              cat /tmp/hse-m205-browser-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/hse-m205-browser-server.log
          exit 1
      - name: Run M2.05 real Chromium journey
        run: node scripts/m2-05-browser-qa.mjs
      - name: Strict TypeScript after browser exercise
        if: success()
        run: npm run typecheck
      - name: Lint after browser exercise
        if: success()
        run: npm run lint
      - name: Collect browser evidence
        if: always()
        run: |
          mkdir -p artifacts/m2-05-browser
          cp /tmp/hse-m205-browser-server.log artifacts/m2-05-browser/server.log || true
      - name: Upload M2.05 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-05-browser-${{ github.sha }}
          path: artifacts/m2-05-browser
          if-no-files-found: warn
          retention-days: 14
