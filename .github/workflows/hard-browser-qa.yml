# Permanent release gate: exact-head browser synchronization and product flows must prove themselves here.
name: Hard Browser QA

on:
  push:
    branches: [qa/hard-browser-m2-02-m2-06]
    paths:
      - "scripts/hard-browser-qa.mjs"
      - "scripts/hard-browser-retrospective.mjs"
      - "scripts/hard-browser-public-concern.mjs"
      - "scripts/seed-public-verification-browser.mjs"
      - "scripts/hard-browser-zero-state.mjs"
      - "scripts/locate-root-migration.mjs"
      - "tests/platform/root-bootstrap-service-principal.test.mjs"
      - "tests/platform/audit-action-constraint-sync.test.mjs"
      - "tests/platform/verifier-review-navigation.test.mjs"
      - "tests/platform/hard-browser-audit-contract.test.mjs"
      - ".github/workflows/hard-browser-qa.yml"
      - "src/**"
      - "database/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main, qa/hard-browser-m2-02-m2-06]
    paths:
      - "scripts/hard-browser-qa.mjs"
      - "scripts/hard-browser-retrospective.mjs"
      - "scripts/hard-browser-public-concern.mjs"
      - "scripts/seed-public-verification-browser.mjs"
      - "scripts/hard-browser-zero-state.mjs"
      - "scripts/locate-root-migration.mjs"
      - "tests/platform/root-bootstrap-service-principal.test.mjs"
      - "tests/platform/audit-action-constraint-sync.test.mjs"
      - "tests/platform/verifier-review-navigation.test.mjs"
      - "tests/platform/hard-browser-audit-contract.test.mjs"
      - ".github/workflows/hard-browser-qa.yml"
      - "src/**"
      - "database/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-hard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HSE_APP_ENV: test
      HSE_DATABASE_DRIVER: pglite
      HSE_PGLITE_DATA_DIR: /tmp/hseverify-hard-browser-db
      HSE_SESSION_SECRET: hard-browser-session-secret-2026-change-only-in-ci-64chars
      HSE_AUTH_PEPPER: hard-browser-auth-pepper-2026-change-only-in-ci-64chars-value
      HSE_ENABLE_AUTH_SANDBOX: "true"
      HSE_AUTH_SANDBOX_ACCESS_KEY: hard-browser-sandbox-key-2026
      HSE_ENABLE_WORKER_DEMO_AUTH: "false"
      HSE_USE_WORKER_DEMO_DATA: "false"
      HSE_RELEASE_SHA: hard-browser-qa
      HSE_BROWSER_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact QA branch head
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Retrospective browser coverage contract
        run: node --test tests/platform/hard-browser-audit-contract.test.mjs

      - name: Root bootstrap service-principal regression
        run: node --test tests/platform/root-bootstrap-service-principal.test.mjs

      - name: Audit action domain/schema synchronization regression
        run: node --test tests/platform/audit-action-constraint-sync.test.mjs

      - name: Verifier visible review-navigation regression
        run: node --test tests/platform/verifier-review-navigation.test.mjs

      - name: Trace any migration-created Root fixture
        run: node scripts/locate-root-migration.mjs

      - name: Syntax-check public concern Chromium harnesses
        run: |
          node --check scripts/seed-public-verification-browser.mjs
          node --check scripts/hard-browser-public-concern.mjs

      - name: Migrate clean browser database
        run: npm run db:migrate

      - name: Assert clean bootstrap database and sandbox configuration
        run: node scripts/hard-browser-zero-state.mjs

      - name: Seed guarded public-verification browser fixture
        run: node scripts/seed-public-verification-browser.mjs

      - name: Install pinned Playwright without modifying lockfile
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Start real Next.js application
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/hse-browser-server.log 2>&1 &
          echo $! > /tmp/hse-browser-server.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/hse-browser-server.pid)" 2>/dev/null; then
              cat /tmp/hse-browser-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/hse-browser-server.log
          exit 1

      - name: Run existing real Chromium zero-state product QA
        run: node scripts/hard-browser-qa.mjs

      - name: Run retrospective completed-workflow Chromium QA
        run: node scripts/hard-browser-retrospective.mjs

      - name: Run public Report Concern Chromium QA
        run: node scripts/hard-browser-public-concern.mjs

      - name: Typecheck after browser exercise
        if: success()
        run: npm run typecheck

      - name: Lint after browser exercise
        if: success()
        run: npm run lint

      - name: Copy server log into evidence bundle
        if: always()
        run: |
          mkdir -p artifacts/hard-browser
          cp /tmp/hse-browser-server.log artifacts/hard-browser/server.log || true

      - name: Upload browser screenshots, results and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hard-browser-qa-${{ github.sha }}
          path: |
            artifacts/hard-browser
            artifacts/hard-browser-retrospective
            artifacts/hard-browser-public-concern
          if-no-files-found: warn
          retention-days: 14
