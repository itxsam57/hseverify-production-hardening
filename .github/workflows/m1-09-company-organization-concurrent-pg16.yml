name: M1.09.01 two Company staff real PostgreSQL16 site and department race
on:
  pull_request:
    paths:
      - 'tests/platform/company-organization-team.test.mjs'
      - 'scripts/run-company-organization-team-tests.mjs'
      - 'src/lib/company/company-organization-repository.ts'
      - '.github/workflows/m1-09-company-organization-concurrent-pg16.yml'
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - 'tests/platform/company-organization-team.test.mjs'
      - 'scripts/run-company-organization-team-tests.mjs'
      - 'src/lib/company/company-organization-repository.ts'
      - '.github/workflows/m1-09-company-organization-concurrent-pg16.yml'
permissions:
  contents: read
concurrency:
  group: m10901-company-organization-race-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-company-staff-site-department-postgres16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: synthetic_company_units
          POSTGRES_PASSWORD: synthetic_company_units_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic_company_units -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact PR head or QA merge
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Install Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact lockfile
        run: npm ci --no-audit --no-fund
      - name: Real PostgreSQL16 two sessions, one version winner, immutable per-actor audit
        shell: bash
        env:
          HSE_M10901_POSTGRES_TEST_DATABASE_URL: postgresql://synthetic_company_units:synthetic_company_units_only@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node scripts/run-company-organization-team-tests.mjs --test-name-pattern 'M1.09.01 actual PostgreSQL16 two Company staff race' 2>&1 | tee .autopilot/artifacts/m10901-two-company-staff-pg16.log
          grep -q 'ℹ tests 1' .autopilot/artifacts/m10901-two-company-staff-pg16.log
          grep -q 'ℹ pass 1' .autopilot/artifacts/m10901-two-company-staff-pg16.log
          grep -q 'ℹ fail 0' .autopilot/artifacts/m10901-two-company-staff-pg16.log
          grep -q 'M10901_ACTUAL_PG16_STAFF_UNIT_RACE_STALE_DENIED' .autopilot/artifacts/m10901-two-company-staff-pg16.log
          grep -q 'M10901_ACTUAL_PG16_SITE_DEPT_HISTORY_IMMUTABLE_DB' .autopilot/artifacts/m10901-two-company-staff-pg16.log
      - name: Archive exact-SHA PostgreSQL16 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10901-company-unit-pg16-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10901-two-company-staff-pg16.log
          if-no-files-found: warn
          retention-days: 30
