name: M1.02 error, validation and retry real-browser QA

on:
  pull_request:
    paths:
      - "tests/browser/error-recovery-controls.browser.test.mjs"
      - "scripts/independent-audit-seed.mjs"
      - "src/app/**/error.tsx"
      - "src/app/error.tsx"
      - "src/components/notifications/notification-error.tsx"
      - "tests/browser/consumer-validation.browser.test.mjs"
      - "tests/browser/worker-file-upload-validation.browser.test.mjs"
      - "tests/browser/company-billing-validation.browser.test.mjs"
      - "tests/browser/all-role-ui-layout.browser.test.mjs"
      - ".github/workflows/m1-02-feedback-states.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "tests/browser/error-recovery-controls.browser.test.mjs"
      - "scripts/independent-audit-seed.mjs"
      - "src/app/**/error.tsx"
      - "src/app/error.tsx"
      - "src/components/notifications/notification-error.tsx"
      - "tests/browser/consumer-validation.browser.test.mjs"
      - "tests/browser/worker-file-upload-validation.browser.test.mjs"
      - "tests/browser/company-billing-validation.browser.test.mjs"
      - "tests/browser/all-role-ui-layout.browser.test.mjs"
      - ".github/workflows/m1-02-feedback-states.yml"

permissions:
  contents: read

concurrency:
  group: hse-m10203-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form-validation-and-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Exercise 1365/390/320 validation, oversize files, billing retry and success
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          for suite in consumer-validation worker-file-upload-validation company-billing-validation; do
            node --test --test-concurrency=1 "tests/browser/${suite}.browser.test.mjs" 2>&1 | tee ".autopilot/artifacts/m10203-${suite}.log"
          done
      - name: Preserve actual Chromium form validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10203-form-states-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10203-*.log
          if-no-files-found: warn
          retention-days: 30

  error-boundary-recovery:
    # Pin to Ubuntu 24.04: this release's isolated recovery test uses PostgreSQL 16.
    # ubuntu-latest currently resolves to Ubuntu 26.04 without postgresql-16 apt.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Ensure disposable PostgreSQL 16 binaries are available
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-16
          fi
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl
      - name: Exercise real Worker/Company failures, no leaks, retry at mobile widths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test tests/browser/error-recovery-controls.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m10203-error-recovery.log
      - name: Preserve real fault/retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10203-error-recovery-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10203-*.log
          if-no-files-found: warn
          retention-days: 30

  all-six-role-page-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Real six-role pages, responsive navigation and notification controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          export HSE_AUDIT_CREDENTIALS_PATH="$RUNNER_TEMP/m10203-all-role-test-credentials.json"
          trap 'rm -f "$HSE_AUDIT_CREDENTIALS_PATH"' EXIT
          node --test tests/browser/all-role-ui-layout.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m10203-all-role-ui.log
      - name: Preserve responsive evidence, screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10203-six-role-ui-${{ env.VERIFIED_SHA }}
          path: |
            .autopilot/artifacts/m10203-all-role-ui.log
            artifacts/all-role-ui-layout/
          if-no-files-found: warn
          retention-days: 30
