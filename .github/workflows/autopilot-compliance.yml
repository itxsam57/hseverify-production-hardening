name: Autopilot Compliance
# UNIVERSAL_AUTOPILOT_V3_WORKFLOW

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.HSE_CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify guarded commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          CANONICAL_BRANCH: qa/masterplan-completion-20260926
        run: |
          base="$BEFORE_SHA"
          head="$HEAD_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"; fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            candidate="$(git merge-base "origin/$CANONICAL_BRANCH" "$head" 2>/dev/null || true)"
            if [ -n "$candidate" ] && [ "$candidate" != "$head" ]; then base="$candidate"; fi
          fi
          python .autopilot/guard.py ci --root . --base-sha "$base" --head-sha "$head"
