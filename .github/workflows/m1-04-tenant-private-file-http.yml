name: M1.04 Company tenant-private PDF HTTP BOLA QA

on:
  pull_request:
    paths:
      - "src/lib/auth/**"
      - "src/lib/authorization/**"
      - "src/lib/secure-files/**"
      - "src/app/api/secure-files/**"
      - "tests/browser/company-secure-files-cross-tenant.browser.test.mjs"
      - "tests/platform/secure-file-access-runtime.test.mjs"
      - ".github/workflows/m1-04-tenant-private-file-http.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "src/lib/auth/**"
      - "src/lib/authorization/**"
      - "src/lib/secure-files/**"
      - "src/app/api/secure-files/**"
      - "tests/browser/company-secure-files-cross-tenant.browser.test.mjs"
      - "tests/platform/secure-file-access-runtime.test.mjs"
      - ".github/workflows/m1-04-tenant-private-file-http.yml"

permissions:
  contents: read

concurrency:
  group: m10402-tenant-secure-file-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-chromium-two-company-file-bola:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install actual Chromium (without runner apt network dependency)
        run: npx playwright install chromium
      - name: Real two-company MFA logins and cross-tenant file/capability abuse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test tests/browser/company-secure-files-cross-tenant.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m10402-company-file-http-chromium.log
      - name: Retain exact-SHA real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10402-company-file-chromium-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10402-company-file-http-chromium.log
          if-no-files-found: warn
          retention-days: 30

  signed-file-core-native-access-and-revocation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Signed file grant, tenant binding, served bytes, audit and revocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node scripts/run-secure-access-runtime-tests.mjs 2>&1 | tee .autopilot/artifacts/m10402-signed-file-native.log
      - name: Retain exact-SHA native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10402-signed-file-native-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10402-signed-file-native.log
          if-no-files-found: warn
          retention-days: 30
