name: HSE Verify 4975 provisional coverage register integrity

on:
  pull_request:
    paths:
      - "docs/qa/2026-10-02-evidence.json"
      - "docs/qa/evidence/*.tsv"
      - "docs/qa/evidence/QA_4975_PROVISIONAL_REGISTER_20261114.csv"
      - "src/app/**"
      - "scripts/audit-4975-coverage.py"
      - "tests/engineering/test_verification_4975_coverage.py"
      - "docs/qa/evidence/MASTERPLAN_218_EXECUTED_TESTS.json"
      - "docs/qa/evidence/MASTERPLAN_218_EXECUTED_TESTS_BY_SCENARIO.csv"
      - "scripts/collect-prior-qa-ci-tests.py"
      - "scripts/reconcile-218-prior-test-evidence.py"
      - "scripts/reconcile-current-release-218.mjs"
      - "scripts/lib/current-release-218-ledger.mjs"
      - "tests/engineering/current-release-218-ledger.test.mjs"
      - "tests/engineering/test_prior_test_evidence.py"
      - "docs/qa/evidence/LEGACY_A28_SCOPED_218_CHECKPOINT_20261106.json"
      - "docs/qa/evidence/MASTERPLAN_218_LEGACY_216_OBSERVATIONS.json"
      - "docs/qa/evidence/MASTERPLAN_218_ALL_PREVIOUS_EVIDENCE_ACTIONS_20261114.csv"
      - "scripts/reconcile-216-historical-scope.py"
      - "scripts/build-218-evidence-action-map.py"
      - "scripts/triage-218-unassigned-tests.py"
      - "docs/qa/evidence/MASTERPLAN_218_UNATTRIBUTED_CASE_REVIEW_20261114.csv"
      - "tests/engineering/test_legacy_216_evidence.py"
      - ".github/workflows/qa-4975-coverage-register.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "docs/qa/2026-10-02-evidence.json"
      - "docs/qa/evidence/*.tsv"
      - "docs/qa/evidence/QA_4975_PROVISIONAL_REGISTER_20261114.csv"
      - "src/app/**"
      - "scripts/audit-4975-coverage.py"
      - "tests/engineering/test_verification_4975_coverage.py"
      - "docs/qa/evidence/MASTERPLAN_218_EXECUTED_TESTS.json"
      - "docs/qa/evidence/MASTERPLAN_218_EXECUTED_TESTS_BY_SCENARIO.csv"
      - "scripts/collect-prior-qa-ci-tests.py"
      - "scripts/reconcile-218-prior-test-evidence.py"
      - "scripts/reconcile-current-release-218.mjs"
      - "scripts/lib/current-release-218-ledger.mjs"
      - "tests/engineering/current-release-218-ledger.test.mjs"
      - "tests/engineering/test_prior_test_evidence.py"
      - "docs/qa/evidence/LEGACY_A28_SCOPED_218_CHECKPOINT_20261106.json"
      - "docs/qa/evidence/MASTERPLAN_218_LEGACY_216_OBSERVATIONS.json"
      - "docs/qa/evidence/MASTERPLAN_218_ALL_PREVIOUS_EVIDENCE_ACTIONS_20261114.csv"
      - "scripts/reconcile-216-historical-scope.py"
      - "scripts/build-218-evidence-action-map.py"
      - "scripts/triage-218-unassigned-tests.py"
      - "docs/qa/evidence/MASTERPLAN_218_UNATTRIBUTED_CASE_REVIEW_20261114.csv"
      - "tests/engineering/test_legacy_216_evidence.py"
      - ".github/workflows/qa-4975-coverage-register.yml"

permissions:
  contents: read

jobs:
  reconcile-provisional-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - name: Python tests for frozen 218 and 4975 conservative counts
        run: python3 tests/engineering/test_verification_4975_coverage.py
      - name: Generate candidate planning register and fail on scope drift
        run: python3 scripts/audit-4975-coverage.py --out-csv .autopilot/artifacts/verification-4975-register.csv
      - name: Verify distinct prior passing tests are preserved inside 218 ledger
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/reconcile-218-prior-test-evidence.py --verify-index
          PYTHONDONTWRITEBYTECODE=1 python3 tests/engineering/test_prior_test_evidence.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/reconcile-216-historical-scope.py --verify-index
          PYTHONDONTWRITEBYTECODE=1 python3 tests/engineering/test_legacy_216_evidence.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build-218-evidence-action-map.py --verify
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/triage-218-unassigned-tests.py --verify
          node --test tests/engineering/current-release-218-ledger.test.mjs
          node scripts/reconcile-current-release-218.mjs
      - name: Archive actual exact SHA planning evidence (not release certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-4975-planning-${{ env.VERIFIED_SHA }}
          path: |
            .autopilot/artifacts/verification-4975-coverage.json
            .autopilot/artifacts/verification-4975-register.csv
          if-no-files-found: warn
          retention-days: 30
