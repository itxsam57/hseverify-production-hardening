name: M1.08.02 pending tenant preissued Company invite and code redemption denial
on:
  pull_request:
    paths:
      - "tests/platform/company-worker-invitations.test.mjs"
      - "scripts/run-company-worker-invitation-tests.mjs"
      - "src/lib/company/company-workforce-service.ts"
      - ".github/workflows/m1-08-pending-preissued-company-secrets.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "tests/platform/company-worker-invitations.test.mjs"
      - "scripts/run-company-worker-invitation-tests.mjs"
      - "src/lib/company/company-workforce-service.ts"
      - ".github/workflows/m1-08-pending-preissued-company-secrets.yml"
permissions:
  contents: read
concurrency:
  group: m10802-pending-preissued-company-secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-m10802-preissued-pending-redeem:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact test candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact lockfile
        run: npm ci --no-audit --no-fund
      - name: Genuine Worker code and invitation fail closed pending tenant, safe reactivation retry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node scripts/run-company-worker-invitation-tests.mjs --test-name-pattern 'M1.08.02 preissued Company code' 2>&1 | tee .autopilot/artifacts/m10802-pending-preissued-secrets-real-pglite.log
          grep -q 'M10802_PREISSUED_PENDING_NO_CODE_OR_INVITATION_CONSUMPTION' .autopilot/artifacts/m10802-pending-preissued-secrets-real-pglite.log
          grep -q 'M10802_REACTIVATION_PREISSUED_SECRETS_SCOPED_RETRY' .autopilot/artifacts/m10802-pending-preissued-secrets-real-pglite.log
          grep -q 'ℹ pass 1' .autopilot/artifacts/m10802-pending-preissued-secrets-real-pglite.log
          if grep -q 'recursively within a test file' .autopilot/artifacts/m10802-pending-preissued-secrets-real-pglite.log; then
            echo 'M10802_INVALID_RECURSIVE_TEST_RUNNER_FALSE_PASS'
            exit 1
          fi
      - name: Archive actual exact-SHA case input/output for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10802-pending-preissued-secrets-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10802-pending-preissued-secrets-real-pglite.log
          if-no-files-found: warn
          retention-days: 30
