name: M2.01.05 real Company-funded Worker full six-role assessment to final credential Chromium
on:
  pull_request:
    paths:
      - 'tests/browser/masterplan-worker-credential-e2e.browser.test.mjs'
      - 'src/app/worker/**'
      - 'src/lib/assessment-attempt/**'
      - 'src/lib/billing/**'
      - 'src/lib/notifications/**'
      - 'src/lib/outbox/**'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'src/lib/credential/**'
      - 'src/lib/decision/**'
      - 'src/lib/interview/**'
      - 'src/app/admin/**'
      - 'src/app/verifier/**'
      - 'src/app/assessor/**'
      - 'src/lib/authorization/**'
      - '.github/workflows/m2-01-05-company-funded-complete-credential-chromium.yml'
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - 'tests/browser/masterplan-worker-credential-e2e.browser.test.mjs'
      - 'src/app/worker/**'
      - 'src/lib/assessment-attempt/**'
      - 'src/lib/billing/**'
      - 'src/lib/notifications/**'
      - 'src/lib/outbox/**'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'src/lib/credential/**'
      - 'src/lib/decision/**'
      - 'src/lib/interview/**'
      - 'src/app/admin/**'
      - 'src/app/verifier/**'
      - 'src/app/assessor/**'
      - 'src/lib/authorization/**'
      - '.github/workflows/m2-01-05-company-funded-complete-credential-chromium.yml'
permissions:
  contents: read
concurrency:
  group: m20105-company-funded-final-credential-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-company-funded-six-role-final-credential-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      HSE_MASTERPLAN_FUNDING_MODE: 'company'
      HSE_M20105_FUNDED_CREDENTIAL_RECEIPT: 'true'
      HSE_MASTERPLAN_ASSURANCE_NOTIFICATIONS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout immutable PR or signed QA SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Pinned Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact lockfile and actual Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compile the real outbox worker required by notification delivery
        run: npm run build:worker
      - name: Actual Worker Company funding request, payment retry, MCQ written Verifier Assessor Admin and Company final credential receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/masterplan-worker-credential-e2e.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m20105-company-funded-final-credential-real-browser.log
          for line in 'ℹ tests 1' 'ℹ pass 1' 'ℹ fail 0' 'ℹ skipped 0'; do
            grep -q "$line" .autopilot/artifacts/m20105-company-funded-final-credential-real-browser.log
          done
          for marker in M20105_ACTUAL_PAYER_COMPANY_BROWSER_ORIGINAL_FUNDED_CASE_APPROVED_AND_VALID_CREDENTIAL M20105_ACTUAL_DB_COMPANY_FUNDING_APPROVED_RESERVED_CREDIT_SAME_SUBMITTED_ATTEMPT_ADMIN_APPROVAL_ISSUED_CREDENTIAL ACTUAL_PASSPORT_DISTINCTION_BROWSER ACTUAL_A17_SCOPED_SHARE_BROWSER ACTUAL_ASSURANCE_NOTIFICATION_BROWSER; do
            grep -q "$marker" .autopilot/artifacts/m20105-company-funded-final-credential-real-browser.log
          done
      - name: Retain exact Company-funded original six-role complete assessment final credential and receiving browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20105-company-funded-final-credential-${{ env.VERIFIED_SHA }}
          path: |
            .autopilot/artifacts/m20105-company-funded-final-credential-real-browser.log
          if-no-files-found: warn
          retention-days: 90
