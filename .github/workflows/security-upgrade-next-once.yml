name: One-time Next security upgrade

on:
  push:
    branches:
      - qa/masterplan-completion-20260926
    paths:
      - ".github/workflows/security-upgrade-next-once.yml"

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, 'chore: upgrade Next.js security patch')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Upgrade patched Next.js family
        run: |
          npm install --save-exact next@16.3.7 @next/env@16.3.7
          npm install --save-dev --save-exact eslint-config-next@16.3.7
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "scripts/check-secure-dependencies.mjs";
          let source = await readFile(path, "utf8");
          const before = 'minimum: "16.3.3"';
          if (!source.includes(before)) {
            throw new Error("Expected Next.js security floor was not found.");
          }
          source = source.replace(before, 'minimum: "16.3.6"');
          await writeFile(path, source);
          NODE

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Compile and lint after security upgrade
        run: |
          npm run check:dependencies
          npm run typecheck
          npm run lint

      - name: Commit generated package lock
        run: |
          if git diff --quiet -- package.json package-lock.json scripts/check-secure-dependencies.mjs; then
            echo "No dependency upgrade changes remain."
            exit 0
          fi
          git config user.name "hseverify-qa-bot"
          git config user.email "hseverify-qa-bot@users.noreply.github.com"
          git add package.json package-lock.json scripts/check-secure-dependencies.mjs
          git commit -m "chore: upgrade Next.js security patch"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
