name: M2.01.02 genuine Company Order Validate Next Server Action foreign role and anonymous replay Chromium
on:
  pull_request:
    paths:
      - 'tests/browser/m2-01-multiworker-submit.browser.test.mjs'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'src/lib/authorization/**'
      - '.github/workflows/m2-01-02-company-action-replay-chromium.yml'
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - 'tests/browser/m2-01-multiworker-submit.browser.test.mjs'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'src/lib/authorization/**'
      - '.github/workflows/m2-01-02-company-action-replay-chromium.yml'
permissions:
  contents: read
concurrency:
  group: m20102-real-company-server-action-replay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-company-validation-next-server-action-six-session-abuse-real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      HSE_M20102_ACTION_REPLAY_ONLY: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout immutable PR or signed QA SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Pinned Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact lockfile and actual Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Original Company Validate real browser action capture then replay five signed-in roles and anonymous, authentic Company succeeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/m2-01-multiworker-submit.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m20102-company-validate-server-action-replay.log
          for line in 'ℹ tests 1' 'ℹ pass 1' 'ℹ fail 0' 'ℹ skipped 0'; do
            grep -q "$line" .autopilot/artifacts/m20102-company-validate-server-action-replay.log
          done
          for marker in M20102_ACTUAL_GENUINE_COMPANY_VALIDATE_ACTION_CAPTURED_NO_MUTATION M20102_ACTUAL_COMPANY_VALIDATE_SERVER_ACTION_FIVE_FOREIGN_ROLES_AND_ANONYMOUS_REPLAY_DENIED M20102_ACTUAL_DB_ONLY_AUTHORIZED_COMPANY_VALIDATION_ONE_AUDIT_TWO_ELIGIBLE_TARGETS_ZERO_CASES_CREDITS; do
            grep -q "$marker" .autopilot/artifacts/m20102-company-validate-server-action-replay.log
          done
      - name: Retain raw original exact SHA attack and legitimate Company proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20102-company-action-replay-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m20102-company-validate-server-action-replay.log
          if-no-files-found: warn
          retention-days: 90
