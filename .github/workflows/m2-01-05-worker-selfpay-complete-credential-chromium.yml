name: M2.01.05 real self-paying Worker independent full assessment to credential and foreign Company denial
on:
  pull_request:
    paths:
      - 'tests/browser/masterplan-worker-credential-e2e.browser.test.mjs'
      - 'src/app/worker/**'
      - 'src/lib/assessment-attempt/**'
      - 'src/lib/billing/**'
      - 'src/lib/notifications/**'
      - 'src/lib/outbox/**'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'src/lib/credential/**'
      - 'src/lib/decision/**'
      - 'src/lib/interview/**'
      - 'src/app/admin/**'
      - 'src/app/verifier/**'
      - 'src/app/assessor/**'
      - 'src/lib/authorization/**'
      - '.github/workflows/m2-01-05-worker-selfpay-complete-credential-chromium.yml'
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - 'tests/browser/masterplan-worker-credential-e2e.browser.test.mjs'
      - 'src/app/worker/**'
      - 'src/lib/assessment-attempt/**'
      - 'src/lib/billing/**'
      - 'src/lib/notifications/**'
      - 'src/lib/outbox/**'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'src/lib/credential/**'
      - 'src/lib/decision/**'
      - 'src/lib/interview/**'
      - 'src/app/admin/**'
      - 'src/app/verifier/**'
      - 'src/app/assessor/**'
      - 'src/lib/authorization/**'
      - '.github/workflows/m2-01-05-worker-selfpay-complete-credential-chromium.yml'
permissions:
  contents: read
concurrency:
  group: m20105-worker-selfpaid-final-credential-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-worker-selfpaid-full-credential-and-foreign-company-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      HSE_MASTERPLAN_FUNDING_MODE: 'independent'
      HSE_M20105_WORKER_SELF_PAID_CREDENTIAL: 'true'
      HSE_MASTERPLAN_ASSURANCE_NOTIFICATIONS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout immutable PR or signed QA SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Pinned Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact lockfile and actual Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Compile the real outbox worker required by notification delivery
        run: npm run build:worker
      - name: Actual Worker self-payment confirmation, MCQ written, Verifier Assessor Admin, credential and foreign Company HTTP404
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/masterplan-worker-credential-e2e.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m20105-worker-selfpaid-final-credential-real-browser.log
          for line in 'ℹ tests 1' 'ℹ pass 1' 'ℹ fail 0' 'ℹ skipped 0'; do
            grep -q "$line" .autopilot/artifacts/m20105-worker-selfpaid-final-credential-real-browser.log
          done
          for marker in M20105_ACTUAL_DB_WORKER_SELF_PAY_ORIGINAL_APPLICATION_TO_ISSUED_CREDENTIAL M20105_ACTUAL_FOREIGN_COMPANY_KNOWN_SELF_FUNDED_ORDER_404_NO_CREDENTIAL ACTUAL_PASSPORT_DISTINCTION_BROWSER ACTUAL_A17_SCOPED_SHARE_BROWSER ACTUAL_ASSURANCE_NOTIFICATION_BROWSER ACTUAL_M20105_IDENTITY_SUBMISSION_MANUAL_REVIEW_ACK_BROWSER; do
            grep -q "$marker" .autopilot/artifacts/m20105-worker-selfpaid-final-credential-real-browser.log
          done
          for identity_attachment in 'Identity document' 'Profile photo' 'Selfie evidence'; do
            grep -Fq "ACTUAL_M20105_IDENTITY_SECURE_ATTACHMENT_ACK_BROWSER $identity_attachment" .autopilot/artifacts/m20105-worker-selfpaid-final-credential-real-browser.log
          done
      - name: Retain exact Worker self-payment original full assessment credential and foreign Company direct denial browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20105-worker-selfpaid-final-credential-${{ env.VERIFIED_SHA }}
          path: |
            .autopilot/artifacts/m20105-worker-selfpaid-final-credential-real-browser.log
          if-no-files-found: warn
          retention-days: 90
