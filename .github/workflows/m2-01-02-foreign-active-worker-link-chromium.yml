name: M2.01.02 real active Worker link owned by foreign Company tenant denial Chromium
on:
  pull_request:
    paths:
      - 'tests/browser/m2-01-multiworker-submit.browser.test.mjs'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'database/migrations/**'
      - '.github/workflows/m2-01-02-foreign-active-worker-link-chromium.yml'
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - 'tests/browser/m2-01-multiworker-submit.browser.test.mjs'
      - 'src/app/company/(portal)/assurance-orders/**'
      - 'src/lib/assurance/**'
      - 'database/migrations/**'
      - '.github/workflows/m2-01-02-foreign-active-worker-link-chromium.yml'
permissions:
  contents: read
concurrency:
  group: m20102-foreign-link-${{ github.ref }}
  cancel-in-progress: true
jobs:
  company-foreign-tenant-active-worker-link-form-denial-real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      HSE_M20102_FOREIGN_TENANT_LINK_ONLY: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact PR or signed QA SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install lockfile dependencies and real Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real Company A tries Company B live Worker link and receives neutral denial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/m2-01-multiworker-submit.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m20102-foreign-tenant-worker-link-chromium.log
          for line in 'ℹ tests 1' 'ℹ pass 1' 'ℹ fail 0' 'ℹ skipped 0'; do
            grep -q "$line" .autopilot/artifacts/m20102-foreign-tenant-worker-link-chromium.log
          done
          for marker in M20102_ACTUAL_FOREIGN_COMPANY_ACTIVE_WORKER_LINK_ADD_FORM_DENIED_NEUTRALLY M20102_ACTUAL_DB_FOREIGN_ACTIVE_LINK_REMAINS_PRIVATE_LOCAL_TWO_WORKER_DRAFT_UNCHANGED_NO_CASES_OR_CREDITS; do
            grep -q "$marker" .autopilot/artifacts/m20102-foreign-tenant-worker-link-chromium.log
          done
      - name: Original exact SHA cross-tenant form raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m20102-foreign-tenant-worker-link-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m20102-foreign-tenant-worker-link-chromium.log
          if-no-files-found: warn
          retention-days: 90
