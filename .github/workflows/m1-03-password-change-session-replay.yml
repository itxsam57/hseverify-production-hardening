name: M1.03 password change six-role copied-session replay QA

on:
  pull_request:
    paths:
      - "src/lib/auth/**"
      - "src/app/account/security/**"
      - "src/app/auth/**"
      - "tests/browser/password-change-boundaries.browser.test.mjs"
      - "tests/platform/account-security-*.test.mjs"
      - ".github/workflows/m1-03-password-change-session-replay.yml"
  push:
    branches:
      - qa/a28-eligibility-read-guard-20261107
    paths:
      - "src/lib/auth/**"
      - "src/app/account/security/**"
      - "src/app/auth/**"
      - "tests/browser/password-change-boundaries.browser.test.mjs"
      - "tests/platform/account-security-*.test.mjs"
      - ".github/workflows/m1-03-password-change-session-replay.yml"

permissions:
  contents: read

concurrency:
  group: m10308-password-copied-cookie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-role-password-replay-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install actual Chromium
        run: npx playwright install chromium
      - name: Real six-role password reauth, 320/390 screen and copied-cookie replay after rotation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/browser/password-change-boundaries.browser.test.mjs 2>&1 | tee .autopilot/artifacts/m10308-six-role-password-chromium.log
      - name: Preserve exact candidate Chromium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10308-password-chromium-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10308-six-role-password-chromium.log
          if-no-files-found: warn
          retention-days: 30

  audit-rollback-and-notifications-native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERIFIED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Password update rollback, immutable six-role audits and notification persistence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autopilot/artifacts
          node --test --test-concurrency=1 tests/platform/account-security-business-rollback.test.mjs tests/platform/account-security-audit-runtime.test.mjs tests/platform/account-security-notification-runtime.test.mjs 2>&1 | tee .autopilot/artifacts/m10308-account-security-native.log
      - name: Preserve exact candidate native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m10308-account-security-native-${{ env.VERIFIED_SHA }}
          path: .autopilot/artifacts/m10308-account-security-native.log
          if-no-files-found: warn
          retention-days: 30
